name: CI

on:
  push:
    branches: [main]
  pull_request:

# Every job runs scripts/verify.py, so CI and local runs execute the same checks.
jobs:
  python:
    name: Engine, HUD and scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r services/yapper-engine/requirements.txt "ruff>=0.4.0"

      - name: Verify
        run: python scripts/verify.py --only python

  node:
    name: Packages and showcase
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: yarn

      - name: Install
        run: yarn install --frozen-lockfile

      - name: Verify
        run: python3 scripts/verify.py --only node

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Scan history for leaked secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
